<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Página no encontrada</title>
    <style>
      :root {
        --bg: #0f1115;
        --bg-alt: #161923;
        --accent: #7c5cff;
        --accent-soft: rgba(124, 92, 255, 0.15);
        --text: #f4f4f7;
        --text-muted: #9ca0ae;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 20% 20%, var(--bg-alt), var(--bg) 60%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
        position: relative;
      }

      .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        background: var(--accent);
        filter: blur(160px);
        opacity: 0.18;
        border-radius: 50%;
        top: -100px;
        right: -100px;
        pointer-events: none;
      }

      .glow.bottom {
        top: auto;
        right: auto;
        bottom: -150px;
        left: -150px;
        opacity: 0.12;
      }

      .container {
        position: relative;
        z-index: 1;
        max-width: 560px;
        width: 100%;
        text-align: center;
      }

      .code {
        font-size: clamp(80px, 18vw, 140px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -4px;
        background: linear-gradient(135deg, var(--text) 20%, var(--accent) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 8px;
      }

      .badge {
        display: inline-block;
        padding: 6px 14px;
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid rgba(124, 92, 255, 0.3);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      h1 {
        font-size: clamp(20px, 4vw, 26px);
        font-weight: 700;
        margin-bottom: 12px;
      }

      p {
        color: var(--text-muted);
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 40px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 0.15s ease,
          background 0.15s ease,
          border-color 0.15s ease;
        cursor: pointer;
        border: 1px solid transparent;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-primary:hover {
        background: #6b4bff;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: transparent;
        color: var(--text);
        border-color: var(--border);
      }

      .btn-secondary:hover {
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-2px);
      }

      .search {
        display: flex;
        max-width: 380px;
        margin: 0 auto;
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        transition: border-color 0.15s ease;
      }

      .search:focus-within {
        border-color: var(--accent);
      }

      .search input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        padding: 12px 16px;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
      }

      .search input::placeholder {
        color: var(--text-muted);
      }

      .search button {
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 0 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        transition: color 0.15s ease;
      }

      .search button:hover {
        color: var(--accent);
      }

      footer {
        margin-top: 28px;
        font-size: 13px;
        color: var(--text-muted);
      }

      footer a {
        color: var(--accent);
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .actions {
          flex-direction: column;
        }
        .btn {
          justify-content: center;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow bottom"></div>

    <main class="container">
      <div class="code">404</div>
      <span class="badge">Error de página</span>
      <h1>No pudimos encontrar esta página</h1>
      <p>
        Puede que el enlace esté roto, que la página se haya movido, o que nunca haya existido. Revisa la URL o vuelve
        al inicio.
      </p>

      <div class="actions">
        <a href="/" class="btn btn-primary"> ← Volver al inicio </a>
        <a href="javascript:history.back()" class="btn btn-secondary"> Página anterior </a>
      </div>

      <form class="search" id="ytSearch" target="_blank" onsubmit="return submitYtSearch(event);">
        <input type="text" id="ytQuery" placeholder="Buscar en YouTube..." aria-label="Buscar" />
        <button type="submit" aria-label="Buscar">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>

      <footer>¿Sigues teniendo problemas? <a href="mailto:info@frankgp.com">Contáctanos</a></footer>
    </main>

    <script>
      // Prefijo fijo para priorizar resultados de tu canal
      const YT_PREFIX = "frank gp ";

      function submitYtSearch(event) {
        event.preventDefault();
        const input = document.getElementById("ytQuery");
        const userQuery = input.value.trim();
        const fullQuery = YT_PREFIX + userQuery;
        const url = "https://www.youtube.com/results?search_query=" + encodeURIComponent(fullQuery);
        window.open(url, "_blank");
        return false;
      }
    </script>
  </body>
</html>
