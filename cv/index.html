    <style>
      /* Única fuente para la versión web Y el PDF descargable (ver
         scripts/generate-cv-pdf.js) — antes existían dos archivos casi
         duplicados (cv/index.html condensado + cv/cv-preview-pdf.html
         detallado); ahora es uno solo. A propósito usa Arial en vez de las
         fuentes del sitio (JetBrains Mono/Inter): además de ser más
         ATS-safe para el PDF (Chromium embebe variable fonts de Google
         Fonts como Type3 en vez de TrueType), mantiene el mismo look en
         pantalla y en el PDF generado, sin reglas @media print que
         cambien la tipografía. Se redefinen --mono/--sans para que los
         componentes compartidos (logo, tags, select) hereden Arial
         también. Los colores sí usan las variables del sitio (--bg-elev,
         --text, --cyan, etc.) para que el toggle de tema funcione — el
         PDF los fuerza siempre a modo claro en @media print, más abajo. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --mono: Arial, Helvetica, "Segoe UI", sans-serif;
        --sans: Arial, Helvetica, "Segoe UI", sans-serif;
      }
      body {
        font-family: var(--sans);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 900px 500px at 15% -5%, var(--glow-1), transparent 60%),
          radial-gradient(ellipse 700px 500px at 100% 10%, var(--glow-2), transparent 60%);
        pointer-events: none;
        z-index: 0;
      }

      /* ---------- HEADER (no imprime) ---------- */
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--header-bg);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-soft);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 28px;
        max-width: 860px;
        margin: 0 auto;
      }
      .logo {
        font-weight: 700;
        font-size: 16px;
      }
      .logo span {
        color: var(--cyan);
      }
      .lang-toggle {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text-dim);
        background: var(--bg-elev-2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 8px 11px;
        cursor: pointer;
      }
      .lang-toggle:hover {
        color: var(--cyan);
        border-color: var(--cyan);
      }
      .print-btn {
        font-size: 13px;
        font-weight: 600;
        background: var(--brand-green);
        color: #03150e;
        padding: 9px 16px;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: none;
        cursor: pointer;
      }
      .print-btn:hover {
        background: #57e6ac;
      }
      .print-btn svg {
        width: 15px;
        height: 15px;
      }

      main {
        position: relative;
        z-index: 1;
        padding: 48px 0 80px;
      }
      .cv-wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 28px;
      }

      /* ---------- SHEET ---------- */
      .sheet {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 44px 50px 54px;
      }

      /* ---------- IDENTIDAD ---------- */
      .cv-header {
        text-align: center;
        padding-bottom: 18px;
        border-bottom: 2px solid var(--cyan);
      }
      .cv-name {
        font-size: 29px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .cv-title {
        margin-top: 4px;
        font-size: 12.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--cyan);
      }
      .cv-contact {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .cv-contact-row {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        row-gap: 6px;
        column-gap: 18px;
      }
      .cv-contact-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--text-dim);
        white-space: nowrap;
        text-decoration: none;
      }
      .cv-contact-item:hover {
        color: var(--cyan);
      }
      .cv-contact-item svg {
        width: 13px;
        height: 13px;
        flex: none;
        stroke: var(--cyan);
      }

      /* ---------- SECCIONES ---------- */
      /* Pisa la regla genérica "section { padding: 74px 0; border-top: ... }"
         de components.css (pensada para las secciones grandes del home) —
         acá las secciones del CV son bloques compactos dentro del "sheet". */
      section {
        margin-top: 22px;
        padding: 0;
        border-top: none;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--cyan);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 12px;
      }
      h2::before {
        content: "";
        width: 14px;
        height: 3px;
        background: var(--cyan);
        border-radius: 2px;
      }
      h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-soft);
      }
      p.cv-summary {
        font-size: 12.5px;
        color: var(--text-dim);
        line-height: 1.6;
      }

      ul.cv-bullets {
        list-style: none;
        margin-top: 2px;
      }
      ul.cv-bullets li {
        position: relative;
        padding-left: 15px;
        font-size: 12.3px;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      ul.cv-bullets li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 7px;
        width: 5px;
        height: 5px;
        border-radius: 1px;
        background: var(--cyan);
        opacity: 0.6;
      }

      /* ---------- EXPERIENCIA / EDUCACIÓN ---------- */
      .entry {
        margin-top: 15px;
      }
      .entry:first-child {
        margin-top: 0;
      }
      .entry-role {
        font-size: 12.8px;
        font-weight: 700;
      }
      .entry-org {
        font-weight: 500;
        color: var(--text-dim);
      }
      .entry-date {
        margin-top: 1px;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      /* ---------- SKILLS ---------- */
      .skills-group {
        margin-bottom: 10px;
      }
      .skills-group:last-child {
        margin-bottom: 0;
      }
      .skills-label {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        margin-bottom: 5px;
      }
      .skills-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .skill-tag {
        font-size: 11px;
        font-weight: 500;
        color: var(--cyan);
        background: var(--cyan-dim);
        border-radius: 4px;
        padding: 3px 8px;
      }

      footer {
        border-top: 1px solid var(--border-soft);
        padding: 26px 0;
        position: relative;
        z-index: 1;
      }
      .foot-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 12.5px;
        color: var(--text-faint);
      }
      .foot-row a:hover {
        color: var(--cyan);
      }

      /* ---------- IMPRESIÓN (PDF) — siempre modo claro, sin importar el
         tema activo en pantalla; oculta todo lo que no es el currículum. ---------- */
      @media print {
        /* !important en cada variable: sin esto, ":root:not([data-theme='dark'])"
           y ":root[data-theme='light']" de theme.css (más específicos que un
           simple ":root") le ganaban a este override — el body quedaba con
           el gris clarito del tema (#f6f8fa) en vez de blanco puro, y esa
           diferencia contra el blanco de la página del PDF dibujaba una
           línea visible en el borde derecho/inferior. */
        :root {
          --bg: #ffffff !important;
          --bg-elev: #ffffff !important;
          --bg-elev-2: #f4f4f4 !important;
          --border: #dcdcdc !important;
          --border-soft: #e6e6e6 !important;
          --text: #111111 !important;
          --text-dim: #333333 !important;
          --text-faint: #666666 !important;
          --cyan: #0e7490 !important;
          --cyan-dim: #eef6f8 !important;
        }
        body {
          background: #ffffff !important;
        }
        body::before,
        header,
        footer,
        .theme-toggle,
        .page-nav-select {
          display: none !important;
        }
        main {
          padding: 0;
        }
        .sheet {
          border: none;
          border-radius: 0;
          padding: 0;
        }
        .cv-wrap {
          max-width: 100%;
          padding: 0;
        }
        section {
          break-inside: avoid;
        }
        .entry {
          break-inside: avoid;
        }
        .skills-group {
          break-inside: avoid;
        }
        a {
          color: inherit !important;
        }
      }
    </style>
  </head>

    <script>
      // Toggle de tema claro/oscuro
      (function () {
        const btn = document.querySelector(".theme-toggle");
        const mql = window.matchMedia("(prefers-color-scheme: light)");

        function isLightActive() {
          const current = document.documentElement.getAttribute("data-theme");
          return current === "light" || (!current && mql.matches);
        }
        function syncAria() {
          btn.setAttribute("aria-pressed", String(isLightActive()));
        }

        syncAria();
        btn.addEventListener("click", function () {
          const next = isLightActive() ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
          syncAria();
        });
        mql.addEventListener("change", function () {
          if (!localStorage.getItem("theme")) syncAria();
        });
      })();
    </script>

    <script>
      // Renderiza el CV completo (versión detallada, la misma que se usa
      // para generar el PDF — ver scripts/generate-cv-pdf.js) desde
      // SITE_DATA (assets/js/data.js), única fuente de verdad. Idioma por
      // query string: /cv/?lang=en (default "es"), con un botón para
      // togglearlo sin editar la URL a mano.
      const I18N = true; // sentinel: evita el auto-init en español de page-nav.js, lo llamamos manualmente abajo con el lang correcto
      const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "es";
      document.documentElement.lang = lang;

      const langBtn = document.getElementById("langToggle");
      langBtn.textContent = lang === "es" ? "EN" : "ES";
      langBtn.setAttribute("aria-label", lang === "es" ? "Switch to English" : "Cambiar a español");
      langBtn.addEventListener("click", function () {
        const url = new URL(location.href);
        if (lang === "es") url.searchParams.set("lang", "en");
        else url.searchParams.delete("lang");
        location.href = url.toString();
      });

      renderPageNav(lang);

      // Encabezados de sección — en inglés se usan a propósito los términos
      // literales que buscan los parsers de ATS ("Education", "Work
      // Experience"), no una traducción libre.
      const SECTION_LABELS = {
        profile: { es: "Perfil profesional", en: "Professional Summary" },
        practices: { es: "Arquitectura y responsabilidad técnica", en: "Technical Architecture & Ownership" },
        experience: { es: "Experiencia laboral", en: "Work Experience" },
        education: { es: "Educación", en: "Education" },
        skills: { es: "Habilidades técnicas", en: "Technical Skills" },
      };
      document.getElementById("labelProfile").textContent = SECTION_LABELS.profile[lang];
      document.getElementById("labelPractices").textContent = SECTION_LABELS.practices[lang];
      document.getElementById("labelExperience").textContent = SECTION_LABELS.experience[lang];
      document.getElementById("labelEducation").textContent = SECTION_LABELS.education[lang];
      document.getElementById("labelSkills").textContent = SECTION_LABELS.skills[lang];

      // Íconos inline estilo Lucide (stroke="currentColor", stroke-width="2",
      // round caps/joins) — misma convención del resto del sitio, sin CDN.
      const ICONS = {
        pin: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>`,
        mail: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>`,
        phone: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21z"/><path d="M9 10a.5.5 0 0 0 1 0v-1a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>`,
        linkedin: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>`,
        github: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 1.5 5 1.5 5 1.5c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 8.5c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>`,
        globe: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>`,
      };

      document.getElementById("cvName").textContent = SITE_DATA.name;
      document.getElementById("cvTitle").textContent = SITE_DATA.title;
      document.getElementById("cvSummary").textContent = pick(SITE_DATA.summaryLong, lang);

      const email = SITE_DATA.email.user + "@" + SITE_DATA.email.domain;
      const whatsapp = "+" + SITE_DATA.whatsappNumber.replace(/^(\d{2})/, "$1 ");
      const portfolioUrl = "https://frankgp.com" + SITE_DATA.links.portfolio;
      const contactRows = [
        [
          [ICONS.pin, pick(SITE_DATA.location, lang), null],
          [ICONS.mail, email, "mailto:" + email],
          [ICONS.phone, whatsapp, "https://wa.me/" + SITE_DATA.whatsappNumber],
        ],
        [
          [ICONS.linkedin, SITE_DATA.links.linkedin.replace(/^https?:\/\//, ""), SITE_DATA.links.linkedin],
          [ICONS.github, SITE_DATA.links.github.replace(/^https?:\/\//, ""), SITE_DATA.links.github],
          [ICONS.globe, "frankgp.com" + SITE_DATA.links.portfolio, portfolioUrl],
        ],
      ];
      document.getElementById("cvContact").innerHTML = contactRows
        .map(
          (row) =>
            `<div class="cv-contact-row">${row
              .map(([icon, text, href]) =>
                href
                  ? `<a class="cv-contact-item" href="${href}" target="_blank" rel="noopener">${icon}${text}</a>`
                  : `<span class="cv-contact-item">${icon}${text}</span>`,
              )
              .join("")}</div>`,
        )
        .join("");

      document.getElementById("cvPractices").innerHTML = pick(SITE_DATA.technicalPractices, lang)
        .map((t) => `<li>${t}</li>`)
        .join("");

      function entryBullets(entry) {
        const items = entry.bullets ? pick(entry.bullets, lang) : [pick(entry.desc, lang)];
        return `<ul class="cv-bullets">${items.map((b) => `<li>${b}</li>`).join("")}</ul>`;
      }

      document.getElementById("cvExperience").innerHTML = SITE_DATA.experience
        .map(
          (job) => `
            <div class="entry">
              <div class="entry-head">
                <div class="entry-role">${pick(job.role, lang)} <span class="entry-org">— ${pick(job.org, lang)}</span></div>
                <div class="entry-date">${pick(job.date, lang)}</div>
              </div>
              ${entryBullets(job)}
            </div>`,
        )
        .join("");

      document.getElementById("cvEducation").innerHTML = SITE_DATA.education
        .map(
          (edu) => `
            <div class="entry">
              <div class="entry-head">
                <div class="entry-role">${pick(edu.name, lang)} <span class="entry-org">— ${pick(edu.org, lang)}</span></div>
                <div class="entry-date">${edu.year}</div>
              </div>
              ${edu.bullets ? `<ul class="cv-bullets">${pick(edu.bullets, lang).map((b) => `<li>${b}</li>`).join("")}</ul>` : ""}
            </div>`,
        )
        .join("");

      document.getElementById("cvSkills").innerHTML = SITE_DATA.skills
        .map(
          (group) => `
            <div class="skills-group">
              <div class="skills-label">${pick(group.label, lang)}</div>
              <div class="skills-tags">
                ${group.items.map((i) => `<span class="skill-tag">${pick(i, lang)}</span>`).join("")}
              </div>
            </div>`,
        )
        .join("");

      // Botón de descarga de PDF — apunta al PDF del idioma que se está
      // mostrando ahora mismo (ES o EN), no dos botones separados.
      const cvPdfLink = document.getElementById("cvPdfLink");
      cvPdfLink.href = lang === "en" ? SITE_DATA.links.cvPdfEn : SITE_DATA.links.cvPdf;
      cvPdfLink.setAttribute("download", "");
      document.getElementById("cvPdfLinkText").textContent = lang === "en" ? "Download PDF" : "Descargar PDF";
    </script>
  </body>
</html>
