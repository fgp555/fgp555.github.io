<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio — Franklin Gomez Pacoricona</title>
    <script>
      // Aplica el tema guardado antes del primer render para evitar parpadeo.
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      })();
    </script>
    <script src="https://app.frankgp.com/api/stat/tracker.js" type="module"></script>
    <meta
      name="description"
      content="Portafolio de proyectos entregados: apps móviles, sistemas web y herramientas construidas de principio a fin, con capturas y stack técnico."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/theme.css?v=20260825T193057" />
    <link rel="stylesheet" href="../assets/css/components.css?v=20260825T193057" />
    <script src="../assets/js/data.js?v=20260825T193057"></script>
    <script src="../assets/js/page-nav.js?v=20260825T193057"></script>
    <style>
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 900px 500px at 15% -5%, var(--glow-1), transparent 60%),
          radial-gradient(ellipse 700px 500px at 100% 10%, var(--glow-2), transparent 60%);
        pointer-events: none;
        z-index: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--header-bg);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-soft);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 28px;
        max-width: 1120px;
        margin: 0 auto;
      }
      .logo {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 16px;
      }
      .logo span {
        color: var(--cyan);
      }
      .nav-cta {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        background: var(--brand-cyan);
        color: #04141a;
        padding: 9px 16px;
        border-radius: 7px;
      }
      .nav-cta:hover {
        background: #5de3f5;
      }

      main {
        position: relative;
        z-index: 1;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 28px;
      }

      .hero {
        padding: 60px 0 30px;
        text-align: center;
      }
      .hero h1 {
        font-size: clamp(28px, 4.4vw, 42px);
        max-width: 760px;
        margin: 0 auto 16px;
      }
      .hero h1 .hl {
        color: var(--cyan);
      }
      .hero p {
        color: var(--text-dim);
        font-size: 16.5px;
        max-width: 560px;
        margin: 0 auto;
      }

      /* ---------- FILTERS ---------- */
      .filters {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        padding: 34px 0 44px;
      }
      .filter-chip {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-dim);
        background: var(--bg-elev);
        border: 1px solid var(--border);
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }
      .filter-chip:hover {
        color: var(--cyan);
        border-color: var(--cyan);
      }
      .filter-chip.active {
        color: var(--cyan);
        background: var(--cyan-dim);
        border-color: var(--cyan-border);
      }

      /* ---------- GRID ---------- */
      .port-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding-bottom: 80px;
      }
      .port-card {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease;
      }
      .port-card:hover {
        border-color: var(--cyan);
        transform: translateY(-3px);
      }
      .port-card.hidden {
        display: none;
      }
      .port-img {
        aspect-ratio: 16 / 10;
        background: var(--bg-elev-2);
        overflow: hidden;
      }
      .port-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .port-img-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
        background: linear-gradient(135deg, var(--cyan-dim), var(--green-dim));
        color: var(--text-dim);
        font-family: var(--mono);
        font-weight: 700;
        font-size: 15px;
      }
      .port-body {
        padding: 18px 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }
      .port-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .port-title {
        font-family: var(--mono);
        font-size: 15.5px;
        font-weight: 700;
      }
      .port-desc {
        font-size: 13.5px;
        color: var(--text-dim);
        flex-grow: 1;
      }
      .port-meta {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--text-faint);
      }
      .port-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .port-tags .tag {
        font-size: 11px;
        padding: 4px 8px;
      }
      .port-links {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .port-links a {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--cyan);
        border: 1px solid var(--cyan-border);
        background: var(--cyan-dim);
        padding: 6px 11px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .port-links a:hover {
        border-color: var(--cyan);
      }
      .port-links svg {
        width: 13px;
        height: 13px;
      }

      .empty-state {
        text-align: center;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 13.5px;
        padding: 40px 0 80px;
        display: none;
      }

      footer {
        border-top: 1px solid var(--border-soft);
        padding: 26px 0;
      }
      .foot-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--text-faint);
      }
      .foot-row a:hover {
        color: var(--cyan);
      }

      @media (max-width: 900px) {
        .port-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .port-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="nav">
        <a href="/" class="logo">FGP<span>_</span></a>
        <div style="display: flex; align-items: center; gap: 14px">
          <button class="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro" aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a class="icon-link github-link" href="#" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
          </a>
          <a class="icon-link linkedin-link" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect width="4" height="12" x="2" y="9"></rect><circle cx="4" cy="4" r="2"></circle></svg>
          </a>
          <a class="nav-cta wa-link" href="#" target="_blank" rel="noopener">Contactar</a>
        </div>
      </div>
    </header>

    <main>
      <section class="hero wrap">
        <h1>Proyectos <span class="hl">entregados</span>, no solo planeados</h1>
        <p>Una muestra de trabajo real: apps móviles, sistemas web e infraestructura construidos de principio a fin.</p>
      </section>

      <div class="wrap">
        <div class="filters" id="filters"></div>
        <div class="port-grid" id="grid"></div>
        <p class="empty-state" id="emptyState">No hay proyectos en esta categoría todavía.</p>
      </div>
    </main>

    <footer>
      <div class="wrap foot-row">
        <span>© 2026 Franklin Gomez Pacoricona</span>
        <select class="page-nav-select" id="pageNav" aria-label="Navegar a otra página"></select>
      </div>
    </footer>

    <script>
      const CATEGORY_LABELS = {
        fullstack: "Full Stack",
        mobile: "Mobile",
        frontend: "Frontend",
        tools: "Tools",
      };
      const ROLE_LABELS = {
        backend: "Backend",
        frontend: "Frontend",
        mobile: "Mobile",
        devops: "DevOps",
        design: "Diseño",
      };

      const PROJECTS = SITE_DATA.projects;

      const linkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path></svg>`;

      const grid = document.getElementById("grid");
      const filtersEl = document.getElementById("filters");
      const emptyState = document.getElementById("emptyState");

      function cardHTML(p) {
        const roles = p.roles.map((r) => ROLE_LABELS[r] || r).join(" · ");
        const tags = p.tech.map((t) => `<span class="tag">${t}</span>`).join("");
        const links = p.links
          .map((l) => `<a href="${l.url}" target="_blank" rel="noopener">${linkIcon}${l.label}</a>`)
          .join("");
        const img = p.image
          ? `<img src="${p.image}" alt="${p.title}" loading="lazy" />`
          : `<div class="port-img-placeholder">${p.title}</div>`;
        return `
          <div class="port-card" data-category="${p.category}">
            <div class="port-img">${img}</div>
            <div class="port-body">
              <div class="port-top">
                <span class="port-title">${p.title}</span>
                <span class="badge badge-cyan">${CATEGORY_LABELS[p.category]}</span>
              </div>
              <p class="port-desc">${p.description}</p>
              <div class="port-meta">${roles} · ${p.duration} · ${p.year}</div>
              <div class="port-tags">${tags}</div>
              ${links ? `<div class="port-links">${links}</div>` : ""}
            </div>
          </div>`;
      }

      grid.innerHTML = PROJECTS.map(cardHTML).join("");

      const categories = ["todos", ...new Set(PROJECTS.map((p) => p.category))];
      filtersEl.innerHTML = categories
        .map(
          (c, i) =>
            `<button class="filter-chip${i === 0 ? " active" : ""}" data-filter="${c}">${
              c === "todos" ? "Todos" : CATEGORY_LABELS[c]
            }</button>`,
        )
        .join("");

      filtersEl.addEventListener("click", function (e) {
        const btn = e.target.closest(".filter-chip");
        if (!btn) return;
        filtersEl.querySelectorAll(".filter-chip").forEach((c) => c.classList.remove("active"));
        btn.classList.add("active");
        const filter = btn.dataset.filter;
        let visibleCount = 0;
        grid.querySelectorAll(".port-card").forEach((card) => {
          const match = filter === "todos" || card.dataset.category === filter;
          card.classList.toggle("hidden", !match);
          if (match) visibleCount++;
        });
        emptyState.style.display = visibleCount === 0 ? "block" : "none";
      });
    </script>

    <script>
      // Links centralizados desde assets/js/data.js
      document.querySelectorAll(".wa-link").forEach(function (el) {
        el.href = "https://wa.me/" + SITE_DATA.whatsappNumber;
      });
      document.querySelectorAll(".github-link").forEach(function (el) {
        el.href = SITE_DATA.links.github;
      });
      document.querySelectorAll(".linkedin-link").forEach(function (el) {
        el.href = SITE_DATA.links.linkedin;
      });
    </script>

    <script>
      // Toggle de tema claro/oscuro
      (function () {
        const btn = document.querySelector(".theme-toggle");
        const mql = window.matchMedia("(prefers-color-scheme: light)");

        function isLightActive() {
          const current = document.documentElement.getAttribute("data-theme");
          return current === "light" || (!current && mql.matches);
        }
        function syncAria() {
          btn.setAttribute("aria-pressed", String(isLightActive()));
        }

        syncAria();
        btn.addEventListener("click", function () {
          const next = isLightActive() ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
          syncAria();
        });
        mql.addEventListener("change", function () {
          if (!localStorage.getItem("theme")) syncAria();
        });
      })();
    </script>
  </body>
</html>
