    <style>
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 900px 500px at 15% -5%, var(--glow-1), transparent 60%),
          radial-gradient(ellipse 700px 500px at 100% 10%, var(--glow-2), transparent 60%);
        pointer-events: none;
        z-index: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--header-bg);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-soft);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 28px;
        max-width: 1120px;
        margin: 0 auto;
      }
      .logo {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 16px;
      }
      .logo span {
        color: var(--cyan);
      }
      .nav-cta {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        background: var(--brand-cyan);
        color: #04141a;
        padding: 9px 16px;
        border-radius: 7px;
      }
      .nav-cta:hover {
        background: #5de3f5;
      }

      main {
        position: relative;
        z-index: 1;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 28px;
      }

      .hero {
        padding: 60px 0 30px;
        text-align: center;
      }
      .hero h1 {
        font-size: clamp(28px, 4.4vw, 42px);
        max-width: 760px;
        margin: 0 auto 16px;
      }
      .hero h1 .hl {
        color: var(--cyan);
      }
      .hero p {
        color: var(--text-dim);
        font-size: 16.5px;
        max-width: 560px;
        margin: 0 auto;
      }

      /* ---------- FILTERS ---------- */
      .filters {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        padding: 34px 0 44px;
      }
      .filter-chip {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-dim);
        background: var(--bg-elev);
        border: 1px solid var(--border);
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }
      .filter-chip:hover {
        color: var(--cyan);
        border-color: var(--cyan);
      }
      .filter-chip.active {
        color: var(--cyan);
        background: var(--cyan-dim);
        border-color: var(--cyan-border);
      }

      /* ---------- GRID ---------- */
      .port-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding-bottom: 80px;
      }
      .port-card {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease;
      }
      .port-card:hover {
        border-color: var(--cyan);
        transform: translateY(-3px);
      }
      .port-card.hidden {
        display: none;
      }
      .port-img {
        /* 1920x1200 — ver convención de imágenes de portfolio en CLAUDE.md */
        aspect-ratio: 1920 / 1200;
        background: var(--bg-elev-2);
        overflow: hidden;
      }
      .port-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .port-img-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
        background: linear-gradient(135deg, var(--cyan-dim), var(--green-dim));
        color: var(--text-dim);
        font-family: var(--mono);
        font-weight: 700;
        font-size: 15px;
      }
      .port-body {
        padding: 18px 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }
      .port-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .port-title {
        font-family: var(--mono);
        font-size: 15.5px;
        font-weight: 700;
      }
      .port-desc {
        font-size: 13.5px;
        color: var(--text-dim);
        flex-grow: 1;
      }
      .port-meta {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--text-faint);
      }
      .port-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .port-tags .tag {
        font-size: 11px;
        padding: 4px 8px;
      }
      .port-links {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .port-links a {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--cyan);
        border: 1px solid var(--cyan-border);
        background: var(--cyan-dim);
        padding: 6px 11px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .port-links a:hover {
        border-color: var(--cyan);
      }
      .port-links svg {
        width: 13px;
        height: 13px;
      }

      .empty-state {
        text-align: center;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 13.5px;
        padding: 40px 0 80px;
        display: none;
      }

      footer {
        border-top: 1px solid var(--border-soft);
        padding: 26px 0;
      }
      .foot-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--text-faint);
      }
      .foot-row a:hover {
        color: var(--cyan);
      }

      @media (max-width: 900px) {
        .port-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .port-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- MODAL (detalle de proyecto, pantalla grande) ---------- */
      body.modal-open {
        overflow: hidden;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .modal-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-box {
        /* Siempre oscuro, sin importar el tema claro/oscuro del sitio —
           estilo "visor de galería", igual en ambos modos. */
        --bg-elev: #10151d;
        --bg-elev-2: #161d27;
        --border: #212a35;
        --text: #e8edf2;
        --text-dim: #95a3b3;
        --text-faint: #576474;
        --cyan: #22d3ee;
        --cyan-dim: rgba(34, 211, 238, 0.12);
        --cyan-border: rgba(34, 211, 238, 0.25);

        position: relative;
        width: 100%;
        max-width: 820px;
        max-height: 88vh;
        overflow-y: auto;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--text);
        transform: scale(0.96) translateY(8px);
        transition: transform 0.2s ease;
      }
      .modal-backdrop.open .modal-box {
        transform: scale(1) translateY(0);
      }
      .modal-close {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 2;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-elev-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-dim);
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }
      .modal-close:hover {
        color: var(--cyan);
        border-color: var(--cyan);
      }
      .modal-nav {
        position: fixed;
        top: 50%;
        z-index: 501;
        transform: translateY(-50%);
        width: 46px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        color: #fff;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s ease,
          background 0.15s ease;
      }
      .modal-backdrop.open .modal-nav {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-nav:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      .modal-nav svg {
        width: 22px;
        height: 22px;
      }
      .modal-prev {
        left: 16px;
      }
      .modal-next {
        right: 16px;
      }
      @media (max-width: 700px) {
        .modal-nav {
          width: 38px;
          height: 38px;
        }
        .modal-nav svg {
          width: 18px;
          height: 18px;
        }
        .modal-prev {
          left: 6px;
        }
        .modal-next {
          right: 6px;
        }
      }
      .modal-img {
        /* 1920x1200 — ver convención de imágenes de portfolio en CLAUDE.md */
        aspect-ratio: 1920 / 1200;
        background: var(--bg-elev-2);
        overflow: hidden;
      }
      .modal-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .modal-body {
        padding: 26px 28px 30px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .modal-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .modal-top h2 {
        font-family: var(--mono);
        font-size: 21px;
      }
      .modal-body p {
        color: var(--text-dim);
        font-size: 14.5px;
        line-height: 1.6;
      }
      @media (max-width: 600px) {
        .modal-backdrop {
          padding: 0;
        }
        .modal-box {
          max-height: 100vh;
          height: 100%;
          border-radius: 0;
        }
      }
    </style>
  </head>

    <script>
      const CATEGORY_LABELS = {
        fullstack: "Full Stack",
        mobile: "Mobile",
        frontend: "Frontend",
        tools: "Tools",
        devops: "DevOps",
      };
      const ROLE_LABELS = {
        backend: "Backend",
        frontend: "Frontend",
        mobile: "Mobile",
        devops: "DevOps",
        design: "Diseño",
      };

      const PROJECTS = SITE_DATA.projectsPortfolio;

      const linkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path></svg>`;

      const grid = document.getElementById("grid");
      const filtersEl = document.getElementById("filters");
      const emptyState = document.getElementById("emptyState");

      function cardHTML(p, i) {
        const roles = p.roles.map((r) => ROLE_LABELS[r] || r).join(" · ");
        const tags = p.tech.map((t) => `<span class="tag">${t}</span>`).join("");
        const links = p.links
          .map((l) => `<a href="${l.url}" target="_blank" rel="noopener">${linkIcon}${l.label}</a>`)
          .join("");
        const img = p.image
          ? `<img src="${p.image}" alt="${p.title}" loading="lazy" />`
          : `<div class="port-img-placeholder">${p.title}</div>`;
        return `
          <div class="port-card" data-category="${p.category}" data-index="${i}">
            <div class="port-img">${img}</div>
            <div class="port-body">
              <div class="port-top">
                <span class="port-title">${p.title}</span>
                <span class="badge badge-cyan">${CATEGORY_LABELS[p.category]}</span>
              </div>
              <p class="port-desc">${p.description}</p>
              <div class="port-meta">${roles} · ${p.duration} · ${p.year}</div>
              <div class="port-tags">${tags}</div>
              ${links ? `<div class="port-links">${links}</div>` : ""}
            </div>
          </div>`;
      }

      grid.innerHTML = PROJECTS.map(cardHTML).join("");

      const categories = ["todos", ...new Set(PROJECTS.map((p) => p.category))];
      filtersEl.innerHTML = categories
        .map(
          (c, i) =>
            `<button class="filter-chip${i === 0 ? " active" : ""}" data-filter="${c}">${
              c === "todos" ? "Todos" : CATEGORY_LABELS[c]
            }</button>`,
        )
        .join("");

      filtersEl.addEventListener("click", function (e) {
        const btn = e.target.closest(".filter-chip");
        if (!btn) return;
        filtersEl.querySelectorAll(".filter-chip").forEach((c) => c.classList.remove("active"));
        btn.classList.add("active");
        const filter = btn.dataset.filter;
        let visibleCount = 0;
        grid.querySelectorAll(".port-card").forEach((card) => {
          const match = filter === "todos" || card.dataset.category === filter;
          card.classList.toggle("hidden", !match);
          if (match) visibleCount++;
        });
        emptyState.style.display = visibleCount === 0 ? "block" : "none";
      });

      // ---------- Modal de detalle (click en una card) ----------
      const modal = document.getElementById("portModal");
      const modalImg = document.getElementById("modalImg");
      const modalTitle = document.getElementById("modalTitle");
      const modalBadge = document.getElementById("modalBadge");
      const modalDesc = document.getElementById("modalDesc");
      const modalMeta = document.getElementById("modalMeta");
      const modalTags = document.getElementById("modalTags");
      const modalLinks = document.getElementById("modalLinks");
      let currentIndex = 0;

      function showModalAt(i) {
        currentIndex = (i + PROJECTS.length) % PROJECTS.length; // wraparound circular
        openModal(PROJECTS[currentIndex]);
      }

      function openModal(p) {
        const roles = p.roles.map((r) => ROLE_LABELS[r] || r).join(" · ");
        modalImg.innerHTML = p.image
          ? `<img src="${p.image}" alt="${p.title}" />`
          : `<div class="port-img-placeholder">${p.title}</div>`;
        modalTitle.textContent = p.title;
        modalBadge.textContent = CATEGORY_LABELS[p.category];
        modalDesc.textContent = p.description;
        modalMeta.textContent = `${roles} · ${p.duration} · ${p.year}`;
        modalTags.innerHTML = p.tech.map((t) => `<span class="tag">${t}</span>`).join("");
        modalLinks.innerHTML = p.links
          .map((l) => `<a href="${l.url}" target="_blank" rel="noopener">${linkIcon}${l.label}</a>`)
          .join("");
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("modal-open");
      }

      function closeModal() {
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("modal-open");
      }

      grid.addEventListener("click", function (e) {
        if (e.target.closest("a")) return; // no abrir el modal si el click fue en un link de la card
        const card = e.target.closest(".port-card");
        if (!card) return;
        showModalAt(Number(card.dataset.index));
      });

      document.getElementById("modalClose").addEventListener("click", closeModal);
      document.getElementById("modalPrev").addEventListener("click", () => showModalAt(currentIndex - 1));
      document.getElementById("modalNext").addEventListener("click", () => showModalAt(currentIndex + 1));
      modal.addEventListener("click", function (e) {
        if (e.target === modal) closeModal(); // click en el fondo, fuera de la caja
      });
      document.addEventListener("keydown", function (e) {
        if (!modal.classList.contains("open")) return;
        if (e.key === "Escape") closeModal();
        if (e.key === "ArrowLeft") showModalAt(currentIndex - 1);
        if (e.key === "ArrowRight") showModalAt(currentIndex + 1);
      });
    </script>

    <script>
      // Links centralizados desde assets/js/data.js
      document.querySelectorAll(".wa-link").forEach(function (el) {
        el.href = "https://wa.me/" + SITE_DATA.whatsappNumber;
      });
      document.querySelectorAll(".github-link").forEach(function (el) {
        el.href = SITE_DATA.links.github;
      });
      document.querySelectorAll(".linkedin-link").forEach(function (el) {
        el.href = SITE_DATA.links.linkedin;
      });
    </script>

    <script>
      // Toggle de tema claro/oscuro
      (function () {
        const btn = document.querySelector(".theme-toggle");
        const mql = window.matchMedia("(prefers-color-scheme: light)");

        function isLightActive() {
          const current = document.documentElement.getAttribute("data-theme");
          return current === "light" || (!current && mql.matches);
        }
        function syncAria() {
          btn.setAttribute("aria-pressed", String(isLightActive()));
        }

        syncAria();
        btn.addEventListener("click", function () {
          const next = isLightActive() ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
          syncAria();
        });
        mql.addEventListener("change", function () {
          if (!localStorage.getItem("theme")) syncAria();
        });
      })();
    </script>
  </body>
</html>
