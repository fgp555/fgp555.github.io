<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" fill="none" role="img" aria-labelledby="title description">
  <title id="title">App Publisher — CLI para publicar apps Android</title>
  <desc id="description">Miniatura con una terminal ilustrativa del comando app-publisher deploy: actualizar versionCode, compilar con Gradle y publicar en Google Play.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1920" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1D2B"/>
      <stop offset="1" stop-color="#080D16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1460 370) rotate(145) scale(1050 760)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18C9D8" stop-opacity=".13"/>
      <stop offset="1" stop-color="#18C9D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="132" y1="0" x2="1788" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38E6CB"/>
      <stop offset="1" stop-color="#41BFEF"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#A4E3EE" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1920" height="1200" fill="url(#background)"/>
  <rect width="1920" height="1200" fill="url(#grid)"/>
  <rect width="1920" height="1200" fill="url(#glow)"/>
