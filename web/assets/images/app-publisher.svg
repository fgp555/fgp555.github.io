    <text x="254" y="181" fill="#8DA4B7" font-size="26">CLI · Android · React Native</text>
    <rect x="1483" y="121" width="305" height="57" rx="28.5" fill="#122A31" stroke="#28545D"/>
    <circle cx="1515" cy="149.5" r="6" fill="#45E5D2"/>
    <text x="1537" y="159" fill="#BFE8E2" font-size="24" font-weight="600">Para la comunidad</text>
    <text x="126" y="334" fill="#F1F7FB" font-size="116" font-weight="750" letter-spacing="-5">App Publisher<tspan fill="#45E5D2">_</tspan></text>
    <text x="132" y="401" fill="#AFC0CF" font-size="36">De tu terminal a Google Play.</text>
  </g>
  <rect x="132" y="466" width="1656" height="522" rx="24" fill="#040A11" stroke="#294252" stroke-width="2"/>
  <path d="M156 467H1764Q1787 467 1787 491V536H133V491Q133 467 156 467Z" fill="#162430"/>
  <circle cx="171" cy="502" r="9" fill="#FD6C69"/>
  <circle cx="203" cy="502" r="9" fill="#F1C85C"/>
  <circle cx="235" cy="502" r="9" fill="#46D3A2"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="283" y="512" fill="#8FA4B6" font-size="25">terminal / android-app</text>
    <text x="1515" y="511" fill="#8299AA" font-size="22">FLUJO DE EJEMPLO</text>
    <text x="186" y="614" font-size="37"><tspan fill="#45E5D2">$ </tspan><tspan fill="#EEF5FC">app-publisher deploy</tspan></text>
