    <text x="186" y="804" font-size="31"><tspan fill="#45E5D2">02</tspan><tspan x="260" fill="#D1DEE9">Compilar el AAB con Gradle</tspan><tspan x="1440" fill="#728FA3">COMPILAR</tspan></text>
    <text x="186" y="887" font-size="31"><tspan fill="#45E5D2">03</tspan><tspan x="260" fill="#D1DEE9">Publicar en Google Play</tspan><tspan x="1440" fill="#728FA3">PUBLICAR</tspan></text>
